<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFI Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Auth screen (login / setup) -->
  <div id="auth-screen" class="login-body" style="display:none">
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-logo">NFI</div>
          <h1 id="auth-title">ورود به پنل</h1>
          <p id="auth-sub">به حساب کاربری خود وارد شوید</p>
        </div>
        <div id="auth-msg" class="msg" style="display:none"></div>
        <form id="auth-form" autocomplete="off"></form>
      </div>
      <p class="login-foot">NFI Tools &copy; 2026</p>
    </div>
  </div>

  <!-- Panel -->
  <div class="layout" id="layout" style="display:none">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand-logo small">NFI</div>
        <span class="sidebar-title">پنل مدیریت</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>داشبورد</span>
        </button>
        <button class="nav-item" data-view="games">
          <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 4c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 11 19.5 11s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg><span>بازی‌ها</span>
        </button>
        <button class="nav-item" data-view="apps">
          <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v-2H4zm0 4h16v-2H4zm0 4h10v-2H4z"/></svg><span>برنامه‌ها</span>
        </button>
        <button class="nav-item" data-view="projects">
          <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><span>پروژه‌ها</span>
        </button>
        <button class="nav-item" data-view="orders">
          <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg><span>سفارش‌ها</span>
        </button>
        <button class="nav-item" data-view="invoices">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm-9 14H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V7h2v2zm4 8h-2v-6h2v6zm4 0h-2v-2h2v2zm0-4h-2v-2h2v2z"/></svg><span>فاکتورها</span>
        </button>
        <button class="nav-item" data-view="team">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>تیم</span>
        </button>
        <button class="nav-item" data-view="chat">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg><span>چت</span>
        </button>
        <button class="nav-item" data-view="teams">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2v-1c0-1.1.9-2 2-2s2 .9 2 2v1c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2v-2a4 4 0 0 0-4-4zm-6-6c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zM3 7c0-1.66 1.34-3 3-3s3 1.34 3 3-1.34 3-3 3-3-1.34-3-3zm18-1c0-1.66 1.34-3 3-3s3 1.34 3 3-1.34 3-3 3-3-1.34-3-3z"/></svg><span>تیم‌ها</span>
        </button>
        <button class="nav-item" data-view="manage" data-roles="admin manager supervisor">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>مدیریت</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg><span>تنظیمات</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="avatar" id="avatar">?</div>
          <div>
            <span class="chip-name" id="chip-name">-</span>
            <span class="chip-role" id="chip-role">-</span>
          </div>
          <button class="logout-btn" id="logout-btn" title="خروج">
            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobile-menu">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <h2 class="page-title" id="page-title">داشبورد</h2>
        <div class="topbar-spacer"></div>
        <span class="clock" id="clock"></span>
        <div class="topbar-actions">
          <button class="icon-btn theme-btn" id="theme-btn" title="تغییر تم">☀️</button>
          <div class="notif-wrap" id="notif-wrap">
            <button class="icon-btn notif-btn" id="notif-btn" title="نوتیفیکیشن">
              <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
              <span class="notif-badge" id="notif-badge"></span>
            </button>
            <div class="notif-drop hidden" id="notif-drop">
              <div class="notif-head">
                <strong>نوتیفیکیشن‌ها</strong>
                <button class="btn btn-sm" id="notif-read">همه را خوانده شود</button>
              </div>
              <div class="notif-list" id="notif-list"></div>
            </div>
          </div>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- Alert panel (sticky on the side) -->
  <div id="alert-wrap" style="display:none">
    <div class="alert-panel-head">
      <strong>الرت‌ها</strong>
      <button class="icon-btn btn-sm-x" id="alerts-clear" title="پاک کردن">✕</button>
    </div>
    <div id="alert-list"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal" id="modal">
      <div class="modal-head">
        <h3 id="modal-title">عنوان</h3>
        <button class="icon-btn" id="modal-close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast-wrap"></div>

  <script src="app.js"></script>
</body>
</html>
